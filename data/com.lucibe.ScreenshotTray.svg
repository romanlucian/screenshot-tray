<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Screenshot Tray: a stack of screenshots on a tile, the front one framed by capture corners. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E2B8C"/>
      <stop offset="1" stop-color="#35125A"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC77D"/>
      <stop offset="1" stop-color="#FF8466"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#12041F" flood-opacity="0.45"/>
    </filter>
    <clipPath id="picture">
      <rect x="37" y="48" width="58" height="37" rx="3.5"/>
    </clipPath>
  </defs>

  <!-- tile, with a darker lip underneath for depth -->
  <rect x="8" y="12" width="112" height="108" rx="26" fill="#220A3C"/>
  <rect x="8" y="8" width="112" height="108" rx="26" fill="url(#tile)"/>

  <!-- the stack: two screenshots behind -->
  <g filter="url(#lift)">
    <rect x="30" y="31" width="64" height="45" rx="7" fill="#D6C4EE" transform="rotate(-11 62 53.5)"/>
    <rect x="31" y="36" width="64" height="45" rx="7" fill="#EDE3F9" transform="rotate(-4 63 58.5)"/>
  </g>

  <!-- the newest screenshot, framed by capture corners -->
  <g transform="rotate(4 66 66.5)">
    <g filter="url(#lift)">
      <rect x="33" y="44" width="66" height="45" rx="7" fill="#FFFFFF"/>
    </g>
    <g clip-path="url(#picture)">
      <rect x="37" y="48" width="58" height="37" fill="url(#sky)"/>
      <circle cx="80" cy="58" r="5.5" fill="#FFF3CF"/>
      <path d="M37 85 L52 67 L60 74 L69 63 L95 85 Z" fill="#7443AD"/>
      <path d="M37 85 L47 76 L55 81 L66 72 L80 85 Z" fill="#4A1F7E"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M27 48 V38 H37"/>
      <path d="M95 38 H105 V48"/>
      <path d="M105 85 V95 H95"/>
      <path d="M37 95 H27 V85"/>
    </g>
  </g>
</svg>
