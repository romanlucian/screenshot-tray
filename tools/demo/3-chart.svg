<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <!-- Demo "screenshot": a small chart. Made-up numbers for the README. -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A55C8"/>
      <stop offset="1" stop-color="#5E2B8C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#F5F3F9"/>
  <rect x="40" y="40" width="1120" height="680" rx="24" fill="#FFFFFF"/>
  <text x="96" y="122" font-family="Ubuntu Sans" font-size="42" font-weight="700" fill="#2A1B3D">Sketches this year</text>
  <text x="96" y="166" font-family="Ubuntu Sans" font-size="26" fill="#7A6F8A">January to September</text>
  <g stroke="#ECE8F2" stroke-width="2">
    <line x1="96" y1="260" x2="1104" y2="260"/>
    <line x1="96" y1="380" x2="1104" y2="380"/>
    <line x1="96" y1="500" x2="1104" y2="500"/>
    <line x1="96" y1="620" x2="1104" y2="620"/>
  </g>
  <g fill="url(#bar)">
    <rect x="120" y="440" width="76" height="180" rx="10"/>
    <rect x="232" y="470" width="76" height="150" rx="10"/>
    <rect x="344" y="390" width="76" height="230" rx="10"/>
    <rect x="456" y="360" width="76" height="260" rx="10"/>
    <rect x="568" y="380" width="76" height="240" rx="10"/>
    <rect x="680" y="310" width="76" height="310" rx="10"/>
    <rect x="792" y="330" width="76" height="290" rx="10"/>
    <rect x="904" y="270" width="76" height="350" rx="10"/>
  </g>
  <rect x="1016" y="220" width="76" height="400" rx="10" fill="#F0735A"/>
  <g font-family="Ubuntu Sans" font-size="22" fill="#7A6F8A" text-anchor="middle">
    <text x="158" y="664">Jan</text><text x="270" y="664">Feb</text><text x="382" y="664">Mar</text>
    <text x="494" y="664">Apr</text><text x="606" y="664">May</text><text x="718" y="664">Jun</text>
    <text x="830" y="664">Jul</text><text x="942" y="664">Aug</text><text x="1054" y="664">Sep</text>
