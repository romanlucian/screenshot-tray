<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="760" viewBox="0 0 1200 760">
  <!-- Demo "screenshot": a code editor. -->
  <rect width="1200" height="760" fill="#1E1B2E"/>
  <rect width="1200" height="64" fill="#17142A"/>
  <rect x="24" y="12" width="190" height="52" rx="8" fill="#1E1B2E"/>
  <text x="52" y="46" font-family="Ubuntu Sans" font-size="22" fill="#D6D3E6">tray.js</text>
  <g font-family="Ubuntu Mono" font-size="30">
    <g fill="#5F5A7A" text-anchor="end">
      <text x="80" y="130">1</text><text x="80" y="176">2</text><text x="80" y="222">3</text>
      <text x="80" y="268">4</text><text x="80" y="314">5</text><text x="80" y="360">6</text>
      <text x="80" y="406">7</text><text x="80" y="452">8</text><text x="80" y="498">9</text>
      <text x="80" y="544">10</text><text x="80" y="590">11</text>
    </g>
    <text x="112" y="130" fill="#7C7896">// Dropped somewhere? Then it leaves the tray.</text>
    <text x="112" y="176"><tspan fill="#82AAFF">drag</tspan><tspan fill="#D6D3E6">.</tspan><tspan fill="#82AAFF">connect</tspan><tspan fill="#D6D3E6">(</tspan><tspan fill="#C3E88D">'drag-end'</tspan><tspan fill="#D6D3E6">, (source, drag) </tspan><tspan fill="#C792EA">=&gt;</tspan><tspan fill="#D6D3E6"> {</tspan></text>
    <text x="112" y="222"><tspan fill="#C792EA">    if</tspan><tspan fill="#D6D3E6"> (!refused &amp;&amp; drag.</tspan><tspan fill="#82AAFF">get_selected_action</tspan><tspan fill="#D6D3E6">())</tspan></text>
    <text x="112" y="268"><tspan fill="#D6D3E6">        tray.</tspan><tspan fill="#82AAFF">dismiss</tspan><tspan fill="#D6D3E6">(card);</tspan></text>
    <text x="112" y="314" fill="#D6D3E6">});</text>
    <text x="112" y="406"><tspan fill="#C792EA">function</tspan><tspan fill="#82AAFF"> showTray</tspan><tspan fill="#D6D3E6">(screenshot) {</tspan></text>
    <text x="112" y="452"><tspan fill="#C792EA">    const</tspan><tspan fill="#D6D3E6"> card = </tspan><tspan fill="#C792EA">new</tspan><tspan fill="#FFCB6B"> Card</tspan><tspan fill="#D6D3E6">(screenshot);</tspan></text>
    <text x="112" y="498"><tspan fill="#D6D3E6">    tray.</tspan><tspan fill="#82AAFF">add</tspan><tspan fill="#D6D3E6">(card);   </tspan><tspan fill="#7C7896">// newest nearest the corner</tspan></text>
    <text x="112" y="544"><tspan fill="#C792EA">    return</tspan><tspan fill="#D6D3E6"> card;</tspan></text>
    <text x="112" y="590" fill="#D6D3E6">}</text>
  </g>
  <rect x="112" y="612" width="16" height="34" fill="#C792EA" opacity="0.8"/>
</svg>
